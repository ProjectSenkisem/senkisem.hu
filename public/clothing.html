<style>
:root{
  --glass-b:rgba(255,255,255,.12);
  --glass-border:rgba(255,255,255,.09);
  --t1:#fff;
  --t2:rgba(255,255,255,.74);
  --t3:rgba(255,255,255,.5);
  --text-muted:rgba(255,255,255,.32);
  --soft:255,70,140;
  --cold:12,236,153;
  --red:#e0212b;
  --red-rgb:224,33,43;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px;background:#000}
body{background:#000;color:var(--t1);font-family:'Space Grotesk',sans-serif;font-weight:300;line-height:1.6;overflow-x:hidden}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* NAVBAR */
.nav{position:fixed;top:0;left:0;width:100%;height:64px;padding:0 2.5rem;z-index:1000;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.35);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);transition:background .4s}
.nav.scrolled{background:rgba(0,0,0,.6);border-bottom:1px solid var(--glass-b)}
.brand{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:.12em;text-decoration:none}
.links{display:flex;gap:1.6rem;list-style:none;flex:1;justify-content:center}
.links a{font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--t2);text-decoration:none;padding-top:12px;display:block;transition:color .2s}
.links a:hover,.links a[aria-current="page"]{color:#fff}
.links a[aria-current="page"]{text-decoration:underline;text-underline-offset:.35em;text-decoration-thickness:1px}
.actions{display:flex;align-items:center;gap:.9rem;min-width:96px;justify-content:flex-end}
.support{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:.12em;color:var(--red);text-decoration:none;display:inline-flex;align-items:center;gap:.55rem;text-shadow:0 0 18px rgba(224,33,43,.35)}
.support::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 2.4s ease-in-out infinite}
.support:hover{color:#ff4350}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.langs{display:flex;gap:6px}
.flag{width:34px;height:34px;padding:3px;border-radius:50%;border:2px solid transparent;opacity:.5;transition:opacity .2s}
.flag svg{display:block;width:100%;height:100%;border-radius:50%}
.flag[aria-pressed="true"]{opacity:1;border-color:#fff}
.flag:hover{opacity:.9}
.burger{display:none;flex-direction:column;gap:6px;padding:.6rem}
.burger span{display:block;width:26px;height:2px;background:#fff}
.mnav{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem}
.mnav.open{display:flex}
.mnav a{font-family:'DM Serif Display',serif;font-style:italic;font-size:1.7rem;text-decoration:none;padding:1rem 0;border-bottom:1px solid rgba(255,255,255,.12);width:min(320px,100%);text-align:center}
@media(max-width:1024px){.links{display:none}.burger{display:flex}.actions{min-width:0}}
@media(max-width:480px){.nav{padding:0 1.1rem}.flag{width:28px;height:28px;padding:2px}.support{font-size:1.1rem}.actions{gap:.5rem}}

/* INTRO SCENE */
.intro{position:relative;height:300vh;background:#000}
.intro-stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 58%,rgba(255,255,255,.06),transparent 62%),#000}
.in-label{position:absolute;top:92px;left:0;right:0;z-index:6;display:flex;flex-direction:column;align-items:center;gap:.9rem;font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.2em;color:var(--t3);opacity:0;pointer-events:none}
.in-label i{display:block;width:64px;height:1px;background:rgba(255,255,255,.35);transform:scaleX(0)}
.in-frame{position:absolute;top:84px;left:28px;right:28px;bottom:28px;z-index:5;pointer-events:none;opacity:0}
.in-frame b{position:absolute;width:30px;height:30px;border:0 solid rgba(255,255,255,.7)}
.in-frame b:nth-child(1){top:0;left:0;border-top-width:1px;border-left-width:1px}
.in-frame b:nth-child(2){top:0;right:0;border-top-width:1px;border-right-width:1px}
.in-frame b:nth-child(3){bottom:0;left:0;border-bottom-width:1px;border-left-width:1px}
.in-frame b:nth-child(4){bottom:0;right:0;border-bottom-width:1px;border-right-width:1px}
.in-imgs{position:absolute;left:50%;top:54%;width:min(86vw,560px);height:min(56vh,560px);transform:translate(-50%,-50%);z-index:2}
.in-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;will-change:opacity,transform;-webkit-mask-image:radial-gradient(ellipse closest-side at 50% 50%,#000 78%,transparent 100%);mask-image:radial-gradient(ellipse closest-side at 50% 50%,#000 78%,transparent 100%)}
.in-copy{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 1.2rem;pointer-events:none}
.in-title{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(2.8rem,10.4vw,10rem);line-height:.92;letter-spacing:-.035em;text-shadow:0 0 60px rgba(0,0,0,.9)}
.in-line{display:block;overflow:hidden;padding:.04em .06em}
.in-line>span{display:block;transform:translateY(105%);will-change:transform}
.in-sent{margin-top:clamp(1.2rem,3vh,2.2rem);font-family:'DM Serif Display',serif;font-style:italic;font-size:clamp(1.3rem,3vw,2.5rem);line-height:1.15;color:rgba(255,255,255,.92);opacity:0;text-shadow:0 0 40px #000}
.in-hint{position:absolute;bottom:34px;left:0;right:0;text-align:center;z-index:6;font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.2em;color:var(--t3)}
.intro.static{height:auto}
.intro.static .intro-stick{position:relative;height:auto;min-height:100svh;padding:120px 0 80px}
.intro.static .in-img:first-child{opacity:.55}
.intro.static .in-line>span{transform:none}
.intro.static .in-sent,.intro.static .in-label,.intro.static .in-frame{opacity:1}
.intro.static .in-label i{transform:scaleX(1)}
@media(max-width:700px){.in-label{top:84px}.in-frame{top:78px;left:14px;right:14px;bottom:18px}.in-frame b{width:22px;height:22px}.in-title{font-size:clamp(2.5rem,12.2vw,4.4rem)}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.9rem 1.8rem;border-radius:3px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:background .2s,color .2s,transform .2s,opacity .2s}
.btn.primary{background:#fff;color:#000}
.btn.primary:hover:not(:disabled){background:rgba(255,255,255,.86);transform:translateY(-1px)}
.btn.ghost{border:1px solid rgba(255,255,255,.4);color:#fff}
.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.1)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.alarm{background:#fff;color:#000;font-size:.86rem;letter-spacing:.14em;padding:1.2rem 2.3rem;box-shadow:0 0 0 0 rgba(var(--red-rgb),.6);animation:alarm 2.4s infinite}
.btn.alarm:hover{background:var(--red);color:#fff;animation:none;box-shadow:0 0 40px rgba(var(--red-rgb),.45)}
@keyframes alarm{0%{box-shadow:0 0 0 0 rgba(var(--red-rgb),.55)}70%,100%{box-shadow:0 0 0 18px rgba(var(--red-rgb),0)}}

/* THE ROOM */
.room{--acc:var(--soft);position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:#000;overflow:hidden;border-top:1px solid var(--glass-b)}
.room[data-tone="cold"]{--acc:var(--cold)}
.glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.1s ease}
.glow.s{background:radial-gradient(ellipse at 18% 28%,rgba(255,70,140,.11),transparent 56%)}
.glow.c{background:radial-gradient(ellipse at 82% 62%,rgba(12,236,153,.10),transparent 56%)}
.room[data-tone="soft"] .glow.s,.room[data-tone="cold"] .glow.c{opacity:1}
.scan{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px)}
.room[data-tone="cold"] .scan{opacity:1}
.cut{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.cut.go{animation:cutf .2s steps(3)}
@keyframes cutf{0%{opacity:0}35%{opacity:.16}100%{opacity:0}}
.r-frame{position:absolute;inset:84px 28px 28px;pointer-events:none;z-index:2}
.r-frame b{position:absolute;width:26px;height:26px;border:0 solid rgba(var(--acc),.5);transition:border-color 1s}
.r-frame b:nth-child(1){top:0;left:0;border-top-width:1px;border-left-width:1px}
.r-frame b:nth-child(2){top:0;right:0;border-top-width:1px;border-right-width:1px}
.r-frame b:nth-child(3){bottom:0;left:0;border-bottom-width:1px;border-left-width:1px}
.r-frame b:nth-child(4){bottom:0;right:0;border-bottom-width:1px;border-right-width:1px}

.r-top{position:relative;z-index:3;padding:84px 2.5rem 0;display:flex;align-items:center;gap:1.5rem}
.r-prog{flex:1;height:1px;background:rgba(255,255,255,.16)}
.r-prog i{display:block;height:1px;width:0;background:rgb(var(--acc));box-shadow:0 0 10px rgba(var(--acc),.7);transition:width .7s var(--ease)}
.r-hard{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.08em;color:var(--t2);text-decoration:underline;text-underline-offset:.3em;white-space:nowrap}
.r-hard:hover{color:#fff}
.r-main{position:relative;z-index:3;flex:1;width:min(880px,calc(100% - 3rem));margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:2rem 0}
.r-count{font-family:'Space Mono',monospace;font-size:.76rem;letter-spacing:.14em;color:rgb(var(--acc));margin-bottom:1.4rem;min-height:1.2em}
.r-body{outline:none}
.r-foot{position:relative;z-index:3;width:min(880px,calc(100% - 3rem));margin:0 auto;padding:0 0 calc(2rem + env(safe-area-inset-bottom));display:flex;align-items:center;gap:1rem}
.r-foot .sp{margin-left:auto}
.r-hint{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--t2);letter-spacing:.06em}
.r-echo,.r-boot{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
.r-echo.on,.r-boot.on{opacity:1;pointer-events:auto;cursor:pointer}
.r-echo p{font-family:'Space Mono',monospace;font-size:clamp(.95rem,2vw,1.35rem);color:rgb(var(--cold));max-width:36ch;line-height:1.6;text-shadow:0 0 18px rgba(var(--cold),.45)}
.r-boot div.in{text-align:left;font-family:'Space Mono',monospace;font-size:clamp(.85rem,1.8vw,1.15rem);color:rgb(var(--cold));line-height:2;text-shadow:0 0 14px rgba(var(--cold),.4)}
.r-boot div.in div{opacity:0;animation:logIn .5s var(--ease) forwards}
@media(max-width:700px){.r-top{padding:78px 1.2rem 0}.r-foot{flex-wrap:wrap}.r-hint{order:3;width:100%}.r-frame{inset:78px 14px 18px}}

/* reaction cards */
.rx{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:2rem;background:rgba(0,0,0,.97);opacity:0;pointer-events:none;transition:opacity .25s;--acc:var(--cold)}
.rx.on{opacity:1;pointer-events:auto}
.rx.soft{--acc:var(--soft)}
.rx.alert{--acc:var(--red-rgb)}
.rx-in{width:min(640px,100%)}
.rx-tag{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:rgb(var(--acc));margin-bottom:1.4rem;display:flex;align-items:center;gap:.8rem}
.rx-tag::before{content:'';width:8px;height:8px;background:rgb(var(--acc));box-shadow:0 0 12px rgb(var(--acc));animation:blink 1.1s steps(1) infinite}
.rx-h{font-family:'Space Mono',monospace;font-weight:400;font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin-bottom:1rem}
.rx.soft .rx-h{font-family:'DM Serif Display',serif;font-style:italic;letter-spacing:-.02em}
.rx-p{font-family:'Space Mono',monospace;font-size:clamp(.95rem,2vw,1.2rem);color:var(--t2);line-height:1.7;max-width:44ch}
.rx.soft .rx-p{font-family:'DM Serif Display',serif;font-size:clamp(1.3rem,3vw,1.9rem);color:rgba(255,255,255,.88);line-height:1.3}
.rx-l{font-family:'Space Mono',monospace;font-size:clamp(1.15rem,3vw,1.9rem);line-height:1.4;margin-bottom:.6rem;opacity:0;animation:logIn .6s var(--ease) forwards}
.rx.wow .rx-l:nth-of-type(1){animation:logIn .6s var(--ease) forwards,gl .5s steps(2) .3s 3}
.rx.wow .rx-l:last-of-type{color:rgb(var(--acc));font-size:clamp(.95rem,2vw,1.2rem);margin-top:1.4rem;text-shadow:0 0 16px rgba(var(--acc),.5)}
.rx-btns{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:2rem;opacity:0;animation:logIn .6s var(--ease) forwards}
@keyframes gl{0%,100%{transform:none;text-shadow:none}30%{transform:translate(-4px,1px);text-shadow:4px 0 rgba(255,70,140,.9),-4px 0 rgba(12,236,153,.9)}65%{transform:translate(4px,-1px);text-shadow:-3px 0 rgba(255,70,140,.9),3px 0 rgba(12,236,153,.9)}}

/* glitch on tone cut to cold */
.room.glitch .qt,.room.glitch .title-cold{animation:gl .45s steps(2) 1}

.qt{margin:0;font-weight:400}
.room[data-tone="soft"] .qt{font-family:'DM Serif Display',serif;font-style:italic;font-size:clamp(2rem,5vw,4.2rem);line-height:1.04;letter-spacing:-.025em}
.room[data-tone="cold"] .qt{font-family:'Space Mono',monospace;font-size:clamp(1.15rem,2.5vw,1.9rem);line-height:1.5;letter-spacing:0}
.cur{display:inline-block;width:.5em;height:1em;margin-left:.15em;vertical-align:-.12em;background:rgb(var(--acc));animation:blink 1.1s steps(1) infinite}
.cur.off{display:none}
@keyframes blink{50%{opacity:0}}
.ans{margin-top:2rem;opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.ans.show{opacity:1;transform:none}
.subq{font-family:'Space Mono',monospace;font-size:.82rem;color:var(--t3);margin:-.6rem 0 1.4rem;letter-spacing:.04em}

.opts{display:grid;gap:.15rem}
.opt{position:relative;display:block}
.opt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.opt .l{display:flex;gap:1rem;align-items:baseline;padding:.85rem 0 .85rem 1.1rem;border-left:1px solid rgba(255,255,255,.2);color:var(--t2);transition:padding .35s var(--ease),border-color .25s,color .25s}
.opt .k{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--t3);min-width:1.1rem}
.room[data-tone="soft"] .opt .l{font-family:'DM Serif Display',serif;font-size:clamp(1.3rem,2.7vw,1.9rem);line-height:1.2}
.room[data-tone="cold"] .opt .l{font-family:'Space Mono',monospace;font-size:clamp(.95rem,1.8vw,1.15rem);line-height:1.45}
.opt:hover .l{color:#fff;border-left-color:rgba(255,255,255,.6)}
.opt input:checked+.l{border-left-color:rgb(var(--acc));color:#fff;padding-left:1.7rem}
.opt input:checked+.l .k{color:rgb(var(--acc))}
.opt input:focus-visible+.l{outline:2px solid #fff;outline-offset:2px}
.or{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--t3);padding:.35rem 0 .35rem 1.1rem}

.tx,.oth{width:100%;background:transparent;color:#fff;border:0;border-bottom:1px solid rgba(255,255,255,.4);padding:.7rem 0;font-size:1.25rem;border-radius:0;line-height:1.4;resize:none}
.room[data-tone="soft"] .tx,.room[data-tone="soft"] .oth{font-family:'DM Serif Display',serif;font-size:1.5rem}
.room[data-tone="cold"] .tx,.room[data-tone="cold"] .oth{font-family:'Space Mono',monospace;font-size:1rem}
.tx:focus,.oth:focus{outline:none;border-bottom-color:rgb(var(--acc));box-shadow:0 1px 0 rgb(var(--acc))}
.tx::placeholder,.oth::placeholder{color:rgba(255,255,255,.3)}
.oth-w{margin:.4rem 0 0 1.1rem}

.sl{padding:1rem 0}
.sl-v{font-family:'DM Serif Display',serif;font-size:clamp(4rem,14vw,8rem);line-height:1;letter-spacing:-.03em;color:#fff;transition:color .3s}
.room[data-tone="cold"] .sl-v{font-family:'Space Mono',monospace;font-size:clamp(3.2rem,11vw,6.5rem);text-shadow:0 0 24px rgba(var(--cold),.35)}
.sl.idle .sl-v{color:rgba(255,255,255,.25)}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:rgba(255,255,255,.35);margin:1.6rem 0 .6rem;cursor:pointer;border-radius:0}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:rgb(var(--acc));box-shadow:0 0 14px rgba(var(--acc),.8);border:0;border-radius:0}
.sl input[type=range]::-moz-range-thumb{width:18px;height:18px;background:rgb(var(--acc));box-shadow:0 0 14px rgba(var(--acc),.8);border:0;border-radius:0}
.sl-ax{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:.7rem;color:var(--t3)}

.ax{display:flex;align-items:center;gap:.9rem}
.ax em{font-style:normal;color:var(--t2);font-size:.82em;min-width:6.5rem}
.ax em:last-child{text-align:right}
.ax i{flex:1;height:1px;background:rgba(255,255,255,.35);position:relative}
.ax b{position:absolute;top:-6px;width:12px;height:12px;background:rgb(var(--cold));box-shadow:0 0 12px rgba(var(--cold),.7);transform:translateX(-50%)}
@media(max-width:600px){.ax em{min-width:0;font-size:.74em}}

.lead{color:var(--t2);font-size:1.05rem;max-width:56ch;margin-top:1.1rem}
.lead+.lead{margin-top:.8rem}
.lead a{color:#fff}
.title-soft{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(2.2rem,6vw,5rem);line-height:.98;letter-spacing:-.03em}
.title-soft em{color:var(--t2)}
.title-cold{font-family:'Space Mono',monospace;font-weight:400;font-size:clamp(1.3rem,2.8vw,2rem);line-height:1.4}
.tag{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.2em;color:rgb(var(--acc));margin-bottom:1.2rem}
.row-btns{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem;align-items:center}

/* start / gate */
.badges{display:flex;flex-wrap:wrap;gap:.8rem;margin:1.8rem 0 0}
.badge{border:1px solid rgba(255,255,255,.25);padding:.75rem 1.1rem;min-width:170px}
.badge small{display:block;font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--t3);margin-bottom:.25rem}
.badge b{font-family:'DM Serif Display',serif;font-weight:400;font-size:1.5rem;line-height:1.1}
.badge.sup{border-color:rgba(var(--soft),.6);background:rgba(var(--soft),.06)}
.badge.sup a{display:block;margin-top:.3rem;font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.1em;color:rgb(var(--soft))}
.chance{margin-top:1.6rem;max-width:56ch;font-size:.9rem;color:var(--t2);padding-left:1rem;border-left:1px solid rgba(255,255,255,.25)}
.sysbox{font-family:'Space Mono',monospace;font-size:.78rem;letter-spacing:.1em;color:rgb(var(--cold));line-height:1.9;margin-bottom:1.6rem;text-shadow:0 0 12px rgba(var(--cold),.35)}
.sysbox div{opacity:0;animation:logIn .6s var(--ease) forwards}
.warn{font-family:'Space Mono',monospace;font-size:clamp(.9rem,1.7vw,1.1rem);line-height:1.7;color:#fff;max-width:58ch;border-left:2px solid var(--red);padding-left:1rem;margin-bottom:2.2rem;opacity:0;animation:logIn .7s var(--ease) 1.2s forwards}
.gq{opacity:0;animation:logIn .8s var(--ease) 1.9s forwards}
.gbtn{opacity:0;animation:logIn .8s var(--ease) 2.5s forwards}

/* pause */
.breath{display:flex;align-items:center;gap:1.4rem;margin:2rem 0 1.4rem}
.breath i{width:64px;height:64px;border:1px solid rgb(var(--acc));border-radius:50%;box-shadow:0 0 22px rgba(var(--acc),.4);animation:breathe 6s ease-in-out infinite}
.breath span{font-family:'DM Serif Display',serif;font-style:italic;font-size:clamp(1.8rem,4vw,3rem)}
@keyframes breathe{0%,100%{transform:scale(.55);opacity:.5}50%{transform:scale(1.1);opacity:1}}
.punch{margin-top:2rem;font-family:'Space Mono',monospace;font-size:clamp(1rem,2.2vw,1.4rem);line-height:1.5;color:#fff;max-width:40ch;opacity:0;animation:logIn .8s var(--ease) 2.4s forwards}

/* readout */
.log{margin-top:1.8rem;border-top:1px solid rgba(255,255,255,.18);font-family:'Space Mono',monospace;font-size:clamp(.78rem,1.6vw,.95rem)}
.log div{display:grid;grid-template-columns:11rem 1fr;gap:1rem;padding:.8rem 0;border-bottom:1px solid rgba(255,255,255,.1);opacity:0;transform:translateY(6px);animation:logIn .6s var(--ease) forwards;align-items:center}
.log dt{color:rgb(var(--cold))}
.log dd{color:#fff;overflow-wrap:anywhere}
@keyframes logIn{to{opacity:1;transform:none}}
.logend{margin-top:1.4rem;font-family:'Space Mono',monospace;font-size:.85rem;color:rgb(var(--cold));opacity:0;animation:logIn .8s var(--ease) forwards}
.finding{margin-top:2rem;border:1px solid rgba(var(--red-rgb),.7);background:rgba(var(--red-rgb),.07);padding:1.3rem 1.4rem;max-width:62ch;opacity:0;animation:logIn .9s var(--ease) forwards}
.finding small{display:block;font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.24em;color:var(--red);margin-bottom:.6rem}
.finding p{font-family:'Space Mono',monospace;font-size:clamp(.95rem,1.9vw,1.15rem);line-height:1.6}
@media(max-width:600px){.log div{grid-template-columns:1fr;gap:.4rem}}

.fld{margin-bottom:1.1rem}
.fld>label{display:block;font-size:.9rem;color:var(--t2);margin-bottom:.4rem}
input[type=text],input[type=email]{width:100%;background:transparent;color:#fff;border:0;border-bottom:1px solid rgba(255,255,255,.4);padding:.7rem 0;font:inherit;font-size:1.25rem;border-radius:0;font-family:'DM Serif Display',serif}
input[type=text]:focus,input[type=email]:focus{outline:none;border-bottom-color:rgb(var(--acc));box-shadow:0 1px 0 rgb(var(--acc))}
.chk{display:flex;gap:.8rem;align-items:flex-start;font-size:.9rem;color:var(--t2);margin:.9rem 0}
.chk input{margin-top:.25rem;accent-color:#fff;width:17px;height:17px;flex:0 0 auto}
.err{color:#ff8a8a;font-size:.9rem;margin-top:.8rem;min-height:1.2em}

.drop{display:block;border:1px dashed rgba(255,255,255,.4);padding:2.4rem 1.2rem;text-align:center;cursor:pointer;transition:background .25s,border-color .25s}
.drop:hover,.drop.over{background:rgba(255,255,255,.05);border-color:#fff}
.drop:focus-within{outline:2px solid #fff;outline-offset:3px}
.drop b{display:block;font-family:'DM Serif Display',serif;font-weight:400;font-size:1.7rem}
.drop span{color:var(--t2);font-size:.9rem}
.thumbs{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.2rem}
.thumb{position:relative;width:104px;height:104px;border:1px solid var(--glass-b);overflow:hidden;background:#0a0a0a}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.5);font-size:.9rem;line-height:1}
.promise{margin-top:1.6rem;padding:1.1rem 1.2rem;border:1px solid rgba(var(--cold),.4);font-size:.9rem;color:var(--t2);max-width:62ch}
.promise b{color:rgb(var(--cold));font-family:'Space Mono',monospace;font-weight:400;font-size:.78rem;display:block;margin-bottom:.4rem}

.sizes{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0 .6rem}
.sizes label{position:relative}
.sizes input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;width:100%;height:100%}
.sizes span{display:block;min-width:52px;text-align:center;padding:.65rem .8rem;border:1px solid var(--glass-b);font-family:'Space Mono',monospace;font-size:.8rem}
.sizes input:checked+span{background:#fff;color:#000;border-color:#fff}
.sizes input:focus-visible+span{outline:2px solid #fff;outline-offset:3px}
.sub{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.14em;color:var(--t3);margin:1.6rem 0 .6rem}

.sum{border-top:1px solid var(--glass-b);margin:1.4rem 0}
.sum div{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--glass-b);font-size:.92rem}
.sum dt{color:var(--t2)}
.sum dd{font-family:'Space Mono',monospace;font-size:.78rem;text-align:right;overflow-wrap:anywhere}
.idcard{border:1px solid rgba(255,255,255,.45);padding:1.5rem;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02));font-family:'Space Mono',monospace;max-width:480px;margin:1.6rem 0}
.idcard small{display:block;font-size:.68rem;letter-spacing:.2em;color:var(--t2)}
.idcard strong{display:block;font-size:clamp(1.5rem,5vw,2.3rem);letter-spacing:.06em;margin:.5rem 0;font-weight:700}

.hard{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:1.2rem}
.hard>div{background:#0a0a0a;border:1px solid rgba(255,255,255,.3);padding:1.6rem;width:min(460px,100%);font-size:.95rem;line-height:1.7;color:var(--t2)}
.hard a{color:#fff}
.hard h3{font-family:'DM Serif Display',serif;font-style:italic;font-weight:400;font-size:1.8rem;color:#fff;line-height:1.1;margin-bottom:.6rem}
.hard .row-btns{margin-top:1.2rem}

/* hidden system alert */
.sa{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:1.2rem;background:rgba(0,0,0,.94);opacity:0;pointer-events:none;transition:opacity .2s;--acc:var(--red-rgb)}
.sa.on{opacity:1;pointer-events:auto}
.sa-in{width:min(560px,100%);border:1px solid var(--red);background:#080000;box-shadow:0 0 70px rgba(var(--red-rgb),.28),inset 0 0 40px rgba(var(--red-rgb),.07);animation:saIn .4s steps(5)}
.sa-bar{display:flex;justify-content:space-between;align-items:center;background:var(--red);color:#000;font-family:'Space Mono',monospace;font-size:.72rem;font-weight:700;letter-spacing:.18em;padding:.5rem .9rem}
.sa-bar i{font-style:normal;animation:blink 1s steps(1) infinite}
.sa-body{padding:1.5rem 1.4rem 1.7rem}
.sa-h{font-family:'Space Mono',monospace;font-weight:400;font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.1;margin-bottom:.6rem;animation:gl .45s steps(2) .2s 2}
.sa-p{font-family:'Space Mono',monospace;font-size:.85rem;color:var(--t2);margin-bottom:1.4rem}
.sa-q{font-family:'Space Mono',monospace;font-size:clamp(1rem,2.4vw,1.25rem);line-height:1.5;margin-bottom:.4rem}
.sa .sl-v{font-family:'Space Mono',monospace;font-size:clamp(2.6rem,10vw,4.2rem);text-shadow:0 0 22px rgba(var(--red-rgb),.4)}
@keyframes saIn{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:none}}

/* SOCIAL */
.sn-social-section{padding:5rem 0 4rem;background:#000;position:relative;overflow:hidden}
.sn-social-section-label{text-align:center;font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3rem;display:flex;align-items:center;justify-content:center;gap:1.5rem}
.sn-social-section-label::before,.sn-social-section-label::after{content:'';width:60px;height:1px;background:var(--glass-border)}
.sn-social-icons-row{display:flex;justify-content:center;gap:2rem;flex-wrap:wrap;padding:0 2rem}
.sn-social-icon-card{display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:1.8rem 2.5rem;background:rgba(255,255,255,.03);border:1px solid var(--glass-border);border-radius:4px;text-decoration:none;color:rgba(255,255,255,.55);transition:all .4s var(--ease);min-width:120px;opacity:0;transform:translateY(24px)}
.sn-social-icon-card.visible{opacity:1;transform:translateY(0)}
.sn-social-icon-card:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;transform:translateY(-4px)}
.sn-social-icon-card.tiktok:hover{border-color:rgba(0,255,200,.4);box-shadow:0 0 30px rgba(0,255,200,.06)}
.sn-social-icon-card svg{width:28px;height:28px;fill:currentColor}
.sn-social-icon-name{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase}
.sn-social-icon-card:nth-child(1){transition-delay:.05s}
.sn-social-icon-card:nth-child(2){transition-delay:.15s}
.sn-social-icon-card:nth-child(3){transition-delay:.25s}
.sn-social-icon-card.instagram:hover{border-color:rgba(70,150,255,.55);box-shadow:0 0 30px rgba(70,150,255,.14);color:#78b0ff}
.sn-social-icon-card.youtube:hover{border-color:rgba(255,45,45,.55);box-shadow:0 0 30px rgba(255,45,45,.14);color:#ff5252}
@media(max-width:768px){
  .sn-social-icons-row{display:flex;flex-wrap:nowrap;justify-content:center;gap:.7rem;max-width:none;padding:0 1rem;margin:0}
  .sn-social-icon-card{flex:1 1 0;min-width:0;max-width:112px;padding:1.1rem .4rem}
  .sn-social-icon-card svg{width:22px;height:22px}
  .sn-social-icon-name{font-size:.52rem;letter-spacing:.1em}
}

/* FOOTER */
.sn-footer{position:relative;width:100%;height:80vh;min-height:520px;max-height:900px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:#000;isolation:isolate}
.sn-footer-video-container{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;overflow:hidden;z-index:0}
.sn-footer-video{position:absolute!important;top:50%!important;left:50%!important;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;max-width:none!important;max-height:none!important;object-fit:cover!important;object-position:center!important;transform:translate(-50%,-50%) scale(1.06)!important;z-index:0}
.sn-footer-video.mobile-video{display:none}
@media(max-width:768px){.sn-footer-video.desktop-video{display:none}.sn-footer-video.mobile-video{display:block}}
.sn-footer-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,rgba(0,0,0,.25) 40%,rgba(0,0,0,.68) 100%);z-index:1}
.sn-footer-bar{position:relative;z-index:3;padding:2rem 3rem 2.5rem;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:2rem}
.sn-footer-links{display:flex;flex-direction:column;gap:.85rem}
.sn-footer-links a{font-family:'Space Mono',monospace;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);text-decoration:none;transition:color .25s ease;line-height:1.4}
.sn-footer-links a:hover{color:rgba(255,255,255,.9)}
.sn-footer-copy{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);text-align:right;line-height:1.4}
@media(max-width:768px){

}

  const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
  const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x * x * (3 - 2 * x);
  function measure() { const r = wrap.getBoundingClientRect(), s = wrap.offsetHeight - innerHeight; target = s > 0 ? clamp(-r.top / s, 0, 1) : 0; if (!raf) raf = requestAnimationFrame(render); }
  function render() {

/* ---------- readout: the scan ---------- */
function scores() {
  const out = {};
  Object.keys(AXES).forEach(d => {
    let n = 0, hi = 0;
    Q.filter(q => q.dim === d).forEach(q => { const a = S.a[q.id]; if (a && a.v) { n++; if (a.v === q.hi) hi++; } });
    out[d] = n ? hi / n : null;
  });
  return out;
}
function diag(lang) {
  const X = (en, hu) => lang === 'hu' ? hu : en, L = k => tl(lang, k);
  const sc = scores(), A = id => S.a[id], rows = [];
  const dgOf = id => { const a = A(id); if (!a || !a.v) return null; const q = Q.find(x => x.id === id); return q.dg ? q.dg[lang][optIdx(a.v)] : null; };
  rows.push({ k: L('rk_sub'), v: 'ID: SENKISEM #' + S.ref });
  let best = null;
  Object.keys(AXES).forEach(d => { if (sc[d] === null) return; const dev = Math.abs(sc[d] - .5); if (!best || dev > best.dev) best = { d, dev, hi: sc[d] >= .5 ? 1 : 0 }; });
  rows.push({ k: L('rk_class'), v: best ? ARCH[best.d][best.hi][lang] : X('UNCLASSIFIED', 'BESOROLATLAN') });
  Object.keys(AXES).forEach(d => { if (sc[d] === null) return; const nm = AXES[d][lang]; rows.push({ k: L('ax_' + d), v: nm[0] + ' ↔ ' + nm[1] + ' · ' + Math.round(sc[d] * 100) + '%', ax: { pos: (6 + sc[d] * 88).toFixed(1), nm } }); });
  const role = A('role'), perf = role && typeof role.v === 'number' ? role.v : null;
  const shift = A('shift') ? A('shift').v : null, own = shift ? { a:'b', b:null, c:'a', d:'a' }[shift] : null;
  if (perf !== null) rows.push({ k: L('rk_perf'), v: perf + '% ' + X('performed', 'szerepben') });
  if (perf !== null || own) {
    let a = 70; if (perf !== null) a -= perf * .5; if (own === 'a') a -= 15; if (own === 'b') a += 10; if (sc.self !== null) a += (sc.self - .5) * 30;
    a = Math.round(clamp(a, 3, 97));
    const lost = perf !== null && perf >= 75 && own === 'a';
    rows.push({ k: L('rk_auth'), v: lost ? X('not found', 'nem található') : a + '% · ' + (a < 40 ? X('unstable', 'instabil') : a < 65 ? X('partial', 'részleges') : X('holding', 'stabil')) });
  }
  [['voice','rk_voice'],['night','rk_night'],['attn','rk_unobs'],['flower','rk_flower'],['lose','rk_face'],['dist','rk_dist']].forEach(([id, key]) => { const v = dgOf(id); if (v) rows.push({ k: L(key), v }); });
  const title = A('title') && A('title').v ? String(A('title').v).trim() : '';
  if (title) rows.push({ k: L('rk_title'), v: '«' + title + '»' });
  /* the finding: look for a contradiction */
  const lose = A('lose') ? A('lose').v : null;
  let finding;
  if (own === 'b' && perf !== null && perf >= 60) finding = X(`You say you hardly change around people. Yet you play a role ${perf}% of your day. Both cannot be true. The system believes the second one.`, `Azt mondod, alig változol mások mellett. Mégis a napod ${perf}%-ában szerepet játszol. Mindkettő nem lehet igaz. A rendszer a másodikat hiszi el.`);
  else if (lose === 'd') finding = X('You would not miss your face. That is not nothing. That is the reason this exists.', 'Nem hiányozna az arcod. Ez nem kevés. Pontosan ezért létezik ez az egész.');
  else if (own === 'a' && perf !== null && perf < 40) finding = X(`You say every group brings out a different you, yet you play a role only ${perf}% of the day. Then those are not roles. Those are all you.`, `Azt mondod, minden társaságban más éned jön elő, mégis csak a napod ${perf}%-ában játszol szerepet. Akkor ezek nem szerepek. Ezek mind te vagy.`);
  else if (sc.bond !== null && sc.bond > .5 && A('attn') && A('attn').v === 'a') finding = X('You choose closeness. Yet you feel most yourself alone. The two have not been introduced yet.', 'A közelséget választod. Mégis egyedül érzed magad a leginkább önmagadnak. A kettő még nem találkozott.');
  else finding = X('Nothing in your answers contradicts itself. That is the most suspicious result the system has produced today.', 'A válaszaid egyike sem mond ellent a másiknak. Ez a legkétesebb eredmény, amit a rendszer ma produkált.');
  return { rows, finding, title, unsaid: !!(A('wish') && A('wish').v) };
}

async function addFiles(list) {
  const err = $('perr'); err.textContent = '';
  for (const f of list) {
    if (S.files.length >= CFG.maxPhotos) { err.textContent = t('too_many'); break; }
    if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp)$/i.test(f.name)) { err.textContent = t('bad_type'); continue; }
    try {
      const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' });
      const sc = Math.min(1, CFG.maxEdge / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
      c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); if (bmp.close) bmp.close();   // re-encoding strips EXIF and location
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', CFG.quality));
      S.files.push({ blob, name: 'photo' + (S.files.length + 1) + '.jpg', url: URL.createObjectURL(blob) });
    } catch { err.textContent = t('decode'); }
  }
  $('file').value = ''; drawThumbs();

body{margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;background:#f5f5f5;}
.wrap{max-width:600px;margin:0 auto;background:#fff;}
.hdr{background:#000;padding:40px 24px;text-align:center;}
.hdr h1{color:#fff;font-size:28px;letter-spacing:3px;margin:0;text-transform:uppercase;}
.hdr p{color:rgba(255,255,255,.45);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin:8px 0 0;}
.body{padding:40px 32px;}
h2{color:#000;font-size:20px;line-height:1.3;margin:0 0 16px;}
p{color:#555;font-size:15px;line-height:1.7;margin:0 0 16px;}
.box{background:#f9f9f9;border-left:3px solid #000;padding:16px 20px;border-radius:0 4px 4px 0;margin:28px 0;}
.box p{margin:0;font-size:13px;color:#333;}
.ftr{background:#111;padding:32px 24px;text-align:center;}
.ftr span{color:rgba(255,255,255,.4);font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
</style></head><body><div class="wrap">
<div class="hdr"><h1>Senkisem</h1><p>${esc(c.tag)}</p></div>
<div class="body">
<h2>✅ ${esc(c.h)}</h2>
<p>${c.p}</p>
<div class="box"><p>ID: SENKISEM #${esc(S.ref)}<br>${esc(c.box)}: <strong>${esc(S.contact.email)}</strong></p></div>
<p>${esc(c.chance)}</p>
<p style="font-size:13px;color:#777;">${esc(c.photo)}</p>
<p style="font-size:13px;color:#999;">${esc(c.q)}<br><a href="mailto:info@senkisem.hu" style="color:#000;font-weight:600;text-decoration:none;">info@senkisem.hu</a></p>
<p style="margin-top:32px;font-size:14px;color:#333;">${esc(c.bye)}<br><strong>${esc(c.team)}</strong></p>
</div>
<div class="ftr"><span>© ${new Date().getFullYear()} Senkisem | ${esc(c.rights)}</span></div>
</div></body></html>`;
}
async function postMail(payload) {
  const res = await fetch(CFG.api, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!res.ok) { const e = new Error('[ID Modal] API hiba (' + res.status + ')'); e.status = res.status; throw e; }
  return res.json().catch(() => ({}));
}
function plainText() {
  const p = buildPayload();
  return ['SENKISEM / ID', 'ref: #' + p.ref, 'name: ' + p.name, 'email: ' + p.contactEmail, 'piece: ' + p.product.name + ' (' + p.product.code + ')', 'size: ' + p.size, ''].concat(p.diagnosis, [''], p.answers.map(a => a.id + ' · ' + a.question + '\n   ' + (a.answer || '—'))).join('\n');
}
async function submit() {
  if (S.busy) return; const err = $('serr'); err.textContent = ''; err.className = 'err';
  if (!(S.consent[0] && S.consent[1])) { err.textContent = t('need_consent'); return; }
  S.busy = true; nextB.disabled = true; nextB.textContent = t('sending');
  try {
    const files = [];
    for (const f of S.files) { try { files.push(await fileToBase64(f.blob, f.name)); } catch (e) { console.warn('⚠️ Kép konvertálási hiba:', e.message); } }
    const prod = PRODUCTS[S.a.piece.v].hu;
    const subject = `[ID: Senkisem] Új kitöltés — ${prod} ${S.size} — #${S.ref}`;
    S.res = await postMail({ type: 'admin', subject, html: buildAdminEmailHTML(files.length, true), uploadedFiles: files, isCheckout: true, answers: buildPayload() });
    try {
      await postMail({ type: 'confirmation', subject: LANG === 'hu' ? '✅ Megkaptuk — ID: Senkisem #' + S.ref + ' | Senkisem' : '✅ Received — ID: Senkisem #' + S.ref + ' | Senkisem', html: buildConfirmationEmailHTML(LANG), customerEmail: S.contact.email });
    } catch (e) { console.warn('[ID Modal] Visszaigazoló email hiba:', e.message); }
    ls(CFG.storeKey, null); go(IDX.done);
  } catch (e) {
    const offline = !e.status || e.status === 404 || e.status === 405;
    err.textContent = offline ? t('send_off', { m: CFG.contactEmail }) : t('send_fail');
    if (offline) {
      const fb = $('fb'); fb.hidden = false;
      fb.innerHTML = '<button type="button" class="btn ghost" id="fb-dl">' + esc(t('dl_ans')) + '</button><a class="btn ghost" id="fb-mail" href="#">' + esc(t('mail_ans')) + '</a>';
      $('fb-dl').onclick = () => { const b = new Blob([plainText()], { type: 'text/plain;charset=utf-8' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'senkisem-' + S.ref + '.txt'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
      $('fb-mail').href = 'mailto:' + CFG.contactEmail + '?subject=' + encodeURIComponent('ID: Senkisem #' + S.ref) + '&body=' + encodeURIComponent(plainText().slice(0, 1800));
    }
    nextB.textContent = t('send_btn'); nextB.disabled = false;
  }
  S.busy = false;
}

/* ---------- done ---------- */
function viewDone() {
  setTone('cold'); foot.hidden = true;
  body.innerHTML =
    '<h2 class="title-cold">' + esc(t('done_t')) + '</h2><div class="idcard"><small>' + esc(t('done_ref')) + '</small><strong>ID: SENKISEM #' + esc(S.ref) + '</strong><small>' + esc(t('done_state')) + '</small></div>' +
    '<p class="lead">' + esc(t('done_p')) + '</p><p class="lead">' + esc(t('done_p2')) + '</p>' +
    '<div class="row-btns"><a class="btn ghost" href="/">' + esc(t('done_home')) + '</a><a class="btn ghost" href="/support.html">' + esc(t('done_sup')) + '</a><button type="button" class="btn ghost" id="again">' + esc(t('done_again')) + '</button></div>';
  $('again').onclick = () => { S.a = {}; S.size = ''; S.files.forEach(f => URL.revokeObjectURL(f.url)); S.files = []; S.ref = newRef(); S.res = null; S.consent = [false, false]; go(0); };
}

const ROLEQ = { id:'role', key:'role', ty:'slider',
  hu:{ t:'A napod hány százalékában játszol szerepet?', sub:'Becsüld meg. Nem kell pontosnak lennie.' },
  en:{ t:'What percentage of your day do you spend playing a role?', sub:"Estimate. It doesn't have to be exact." } };
const SA = {
  hu:{ tag:'SYSTEM ALERT · SCAN LEÁLLÍTVA', h:'Hiányzó mérés.', p:'// a scan nem indulhat el. egy adat kimaradt.', btn:'Rögzítés', skip:'Átugrom' },
  en:{ tag:'SYSTEM ALERT · SCAN HALTED', h:'Missing measurement.', p:'// scan cannot start. one value is absent.', btn:'Record', skip:'Skip' } };
function showAlert(done) {
  S.alert = true; S.alertRef = S.ref;
  const L = SA[LANG], q = ROLEQ[LANG], sa = $('sa');
  $('sain').innerHTML = '<div class="sa-bar"><span>' + esc(L.tag) + '</span><i aria-hidden="true">■</i></div><div class="sa-body"><h2 class="sa-h">' + esc(L.h) + '</h2><p class="sa-p">' + esc(L.p) + '</p>' +
    '<p class="sa-q" id="saq">' + esc(q.t) + '</p><p class="subq">' + esc(q.sub) + '</p>' +
    '<div class="sl idle" id="saw"><div class="sl-v" id="sav">—</div><input type="range" id="sasl" min="0" max="100" step="1" value="50" aria-labelledby="saq"><div class="sl-ax"><span>0%</span><span>100%</span></div></div>' +
    '<div class="row-btns"><button type="button" class="btn primary" id="sa-ok" disabled>' + esc(L.btn) + '</button><button type="button" class="btn ghost" id="sa-skip">' + esc(L.skip) + '</button></div></div>';
  sa.classList.add('on');
  const sl = $('sasl'), ok = $('sa-ok');
  const set = () => { S.a.role = { v: +sl.value }; $('sav').textContent = sl.value + '%'; $('saw').classList.remove('idle'); ok.disabled = false; save(); };
  sl.addEventListener('input', set); sl.addEventListener('change', set);
  const close = cb => { S.alert = false; sa.classList.remove('on'); cb(); };
  ok.onclick = () => close(() => showEcho('// ' + S.a.role.v + (LANG === 'hu' ? '% szerepben. a többi: megfigyeletlen.' : '% performed. the rest: unobserved.'), done));
  $('sa-skip').onclick = () => close(() => { delete S.a.role; done(); });
  sl.focus();
}

/* ---------- navigation + keyboard ---------- */
function next() {
  const sc = screens[S.i];
    if (S.card || S.booting || S.alert) return;
  if (echoCb && S.echoSkip) { S.echoSkip(); return; }
  if (S.typeDone) { S.typeDone(); return; }
  clearTimeout(S.auto);
  if (sc.k === 'q') {
    const q = sc.q, r = rxOf(q, S.a[q.id]);
    if (r && r.echo) { showEcho(r.echo[LANG], () => go(S.i + 1)); return; }
    if (r && r.card) { showCard(r.card, () => go(S.i + 1), () => { delete S.a[q.id]; save(); render(); body.focus({ preventScroll: true }); }); return; }
    go(S.i + 1); return;
  }
  if (sc.k === 'contact') {
    const err = $('cerr'); err.textContent = '';
    if (!S.contact.name) { err.textContent = t('need_name'); $('cn').focus(); return; }
    if (!mailOk(S.contact.email)) { err.textContent = t('need_mail'); $('cm').focus(); return; }
    go(S.i + 1); return;
  }
  if (sc.k === 'send') { submit(); return; }
  go(S.i + 1);
}
nextB.addEventListener('click', next);
backB.addEventListener('click', () => {
    if (S.card || S.booting || S.alert) return;
  clearTimeout(S.auto); if (echoCb && S.echoSkip) S.echoSkip();
  go(S.i === FIRSTQ ? 0 : S.i - 1);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('hard').hidden) $('hard').hidden = true; if (!$('nomod').hidden) $('nomod').hidden = true; return; }
    if (S.card || S.alert) return;
  if (S.booting && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); bootEl.click(); return; }
  const r = room.getBoundingClientRect(); if (r.bottom < 80 || r.top > innerHeight - 80) return;
  const ae = document.activeElement; if (ae !== document.body && !room.contains(ae)) return;
  const sc = screens[S.i], tag = (e.target.tagName || '').toLowerCase(), type = e.target.type;
  if (!sc || sc.k === 'start' || sc.k === 'gate' || sc.k === 'done') return;
  if (echoCb && S.echoSkip && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); S.echoSkip(); return; }
  if (e.key === 'Enter' && tag !== 'button' && tag !== 'a' && tag !== 'textarea' && type !== 'file') { e.preventDefault(); if (!nextB.disabled) next(); return; }
  if (/^[1-9]$/.test(e.key) && tag !== 'textarea' && !(tag === 'input' && (type === 'text' || type === 'email'))) {
    const el = body.querySelectorAll('.opts input')[+e.key - 1];
    if (el) { e.preventDefault(); el.click(); }
  }
});

/* ---------- dialogs ---------- */
$('hard-btn').addEventListener('click', () => { $('hard').hidden = false; $('hard-close').focus(); });
$('hard-close').addEventListener('click', () => { $('hard').hidden = true; $('hard-btn').focus(); });
$('hard').addEventListener('click', e => { if (e.target === $('hard')) $('hard').hidden = true; });
$('no-stay').addEventListener('click', () => { $('nomod').hidden = true; });
$('nomod').addEventListener('click', e => { if (e.target === $('nomod')) $('nomod').hidden = true; });

/* ============================================================
   FOOTER VIDEO SWAP + SOCIAL REVEAL
============================================================ */
(function() {
  var desktop = $('sn-footer-video-desktop'), mobile = $('sn-footer-video-mobile');
  if (!desktop || !mobile) return;
  function swapVideo() {
    if (window.innerWidth <= 768) { desktop.style.display = 'none'; mobile.style.display = 'block'; mobile.play().catch(function(){}); }
    else { mobile.style.display = 'none'; desktop.style.display = 'block'; desktop.play().catch(function(){}); }
  }
  swapVideo(); window.addEventListener('resize', swapVideo);
})();
(function() {
  var row = $('sn-social-icons-row'); if (!row) return;
  new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) { if (entry.isIntersecting) entry.target.querySelectorAll('.sn-social-icon-card').forEach(function(c) { c.classList.add('visible'); }); });
  }, { threshold: 0.2 }).observe(row);
})();

/* BOOT */
applyLang(LANG, true);
render();
addEventListener('beforeunload', () => { S.files.forEach(f => URL.revokeObjectURL(f.url)); });
})();
</script>
