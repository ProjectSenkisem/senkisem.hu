<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gb:rgba(255,255,255,.09);--glass-border:rgba(255,255,255,.09);--text-primary:#fff;--t2:rgba(255,255,255,.55);--text-secondary:rgba(255,255,255,.55);--tm:rgba(255,255,255,.32);--text-muted:rgba(255,255,255,.32);--tg:rgba(255,255,255,.18);--ease:cubic-bezier(.16,1,.3,1);--transition:all 0.35s var(--ease)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:#000}
body{background:#000;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1000;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.bg-grid,.amb{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-grid{background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 40%,#000 10%,transparent 70%)}
.amb::before,.amb::after{content:"";position:absolute;width:620px;height:320px;border-radius:50%;filter:blur(90px)}
.amb::before{top:18%;left:12%;background:radial-gradient(ellipse,rgba(0,255,200,.045),transparent 65%)}
.amb::after{bottom:8%;right:8%;background:radial-gradient(ellipse,rgba(255,0,120,.04),transparent 65%)}

/* ===== NAVBAR (az index.html-ből) ===== */
.sn-navbar{position:fixed;top:0;left:0;width:100%;padding:0 2.5rem;height:64px;display:flex;justify-content:space-between;align-items:center;z-index:1000;background:rgba(0,0,0,.35);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);transition:background .4s ease,backdrop-filter .4s ease}
.sn-navbar.scrolled{background:rgba(0,0,0,.55);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-bottom:1px solid var(--glass-border)}
.sn-navbar-brand{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:.12em;color:var(--text-primary);text-decoration:none;flex-shrink:0}
.sn-navbar-links{display:flex;align-items:center;gap:1.2rem;list-style:none;flex:1;justify-content:center}
.sn-navbar-links a{font-family:'DM Serif Display',serif;font-size:1.25rem;letter-spacing:.02em;text-transform:none;color:var(--text-secondary);text-decoration:none;padding-top:15px;display:flex;align-items:center;border-radius:2px;transition:color .22s,background .22s;white-space:nowrap}
.sn-navbar-links a:hover,.sn-navbar-links a[aria-current]{color:var(--text-primary)}
.sn-navbar-actions{display:flex;align-items:center;justify-content:flex-end;gap:.6rem;flex-shrink:0;min-width:96px}
.sn-nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:.4rem;background:none;border:none}
.sn-nav-hamburger span{display:block;width:22px;height:1px;background:var(--text-primary);transition:var(--transition)}
.sn-mobile-nav{display:none;position:fixed;inset:0;width:100%;height:100%;background:rgba(0,0,0,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:2rem}
.sn-mobile-nav.open{display:flex}
.sn-mobile-nav a{font-family:'DM Serif Display',serif;font-style:italic;font-size:1.6rem;letter-spacing:.04em;text-transform:none;border-bottom:1px solid rgba(255,255,255,.1);padding:1.2rem 0}
.sn-mobile-nav a:hover{color:var(--text-primary)}
.sn-mobile-nav-back{position:static;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--text-primary);font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;padding:.75rem 1.5rem;border-radius:3px;cursor:pointer;margin-bottom:1rem;align-self:flex-start}
@media (max-width:1024px){.sn-navbar-links{display:none}.sn-nav-hamburger{display:flex}.sn-navbar-actions{min-width:0}}
@media (max-width:480px){.sn-navbar{padding:0 1.2rem}}
@media (max-width:768px){.sn-nav-hamburger span{width:28px;height:2px}.sn-nav-hamburger{gap:6px;padding:.6rem}.sn-navbar-actions{gap:.8rem}}
.sn-support{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:.12em;color:#e0212b;text-decoration:none;display:inline-flex;align-items:center;gap:.55rem;text-shadow:0 0 18px rgba(224,33,43,.35);transition:color .25s,text-shadow .25s;white-space:nowrap}
.sn-support::before{content:'';width:7px;height:7px;border-radius:50%;background:#e0212b;box-shadow:0 0 10px #e0212b;animation:snPulse 2.4s ease-in-out infinite}
.sn-support:hover{color:#ff4350;text-shadow:0 0 26px rgba(255,67,80,.6)}
@keyframes snPulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@media(max-width:480px){.sn-support{font-size:1.1rem}}
.sn-langs{display:flex;gap:6px;align-items:center;margin-left:.4rem}
.sn-flag{width:34px;height:34px;padding:3px;border-radius:50%;border:2px solid transparent;background:none;opacity:.5;cursor:pointer;transition:opacity .2s}
.sn-flag svg{display:block;width:100%;height:100%;border-radius:50%}
.sn-flag[aria-pressed="true"]{opacity:1;border-color:#fff}
.sn-flag:hover{opacity:.9}
.sn-flag:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:768px){.sn-navbar-actions{gap:.6rem}}
@media(max-width:480px){.sn-langs{gap:4px;margin-left:0}.sn-flag{width:28px;height:28px;padding:2px}.sn-navbar-actions{gap:.45rem}}

/* ===== TARTALOM ===== */
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:150px 2.5rem 4rem}
.tag-g{display:inline-block;font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(0,255,80,.45);border:1px solid rgba(0,255,80,.18);border-radius:2px;padding:.3rem .7rem;margin-bottom:1.6rem}
.eyebrow{font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--tm);margin-bottom:1.4rem;display:flex;align-items:center;gap:1rem}
.eyebrow::before{content:"";width:30px;height:1px;background:var(--tm)}
h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(3rem,7vw,6.4rem);line-height:.92;letter-spacing:-.025em;margin-bottom:1.6rem}
h1 em{font-style:italic;color:var(--t2)}
.sub{font-size:.95rem;line-height:1.75;font-weight:300;color:var(--t2);max-width:460px;margin-bottom:4rem}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.card{display:flex;flex-direction:column;border:1px solid var(--gb);border-radius:3px;background:rgba(255,255,255,.025);overflow:hidden;transition:transform .5s var(--ease),border-color .4s,box-shadow .5s var(--ease)}
.card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.6)}
/* a kép maga a könyv: nincs külön borító, nincs sötétítés */
.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#050505}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s var(--ease),filter .6s var(--ease)}
.card:hover .stage img{transform:scale(1.06);filter:brightness(1.14)}
.body{padding:1.7rem 1.7rem 1.8rem;display:flex;flex-direction:column;flex:1}
.lbl{font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tm);margin-bottom:.7rem}
h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(1.7rem,2.8vw,2.4rem);line-height:1.04;margin-bottom:1rem}
.desc{font-size:.9rem;line-height:1.75;font-weight:300;color:var(--t2);margin-bottom:1.3rem}
.pills{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
.pill{font-family:'Space Mono',monospace;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.12);border-radius:2px;padding:.22rem .6rem}
.sys{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,255,80,.4);margin-bottom:1.6rem}
.cta{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:.6rem;padding:.85rem 1.3rem;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;transition:background .25s,border-color .25s}
.card:hover .cta{background:#fff;color:#000;border-color:#fff}

.foot{margin-top:4rem;padding-top:1.6rem;border-top:1px solid var(--gb);font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tg)}

@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rv{opacity:0;animation:up .9s var(--ease) forwards;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){.rv{animation:none;opacity:1}*{transition:none!important}.sn-support::before{animation:none}}
@media (max-width:860px){.grid{grid-template-columns:1fr}main{padding:115px 1.4rem 3rem}.sub{margin-bottom:2.6rem}}

/* ===== SOCIAL (az index.html-lel azonos) ===== */
.sn-social-section{padding:5rem 0 4rem;background:#000;position:relative;overflow:hidden;z-index:1}
.sn-social-section-label{text-align:center;font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3rem;display:flex;align-items:center;justify-content:center;gap:1.5rem}
.sn-social-section-label::before,.sn-social-section-label::after{content:'';width:60px;height:1px;background:var(--glass-border)}
.sn-social-icons-row{display:flex;justify-content:center;gap:2rem;flex-wrap:wrap;padding:0 2rem}
.sn-social-icon-card{display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:1.8rem 2.5rem;background:rgba(255,255,255,.03);border:1px solid var(--glass-border);border-radius:4px;text-decoration:none;color:var(--text-secondary);transition:all .4s var(--ease);min-width:120px;opacity:0;transform:translateY(24px)}
.sn-social-icon-card.visible{opacity:1;transform:translateY(0)}
.sn-social-icon-card:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--text-primary);transform:translateY(-4px)}
.sn-social-icon-card.tiktok:hover{border-color:rgba(0,255,200,.4);box-shadow:0 0 30px rgba(0,255,200,.06)}
.sn-social-icon-card.instagram:hover{border-color:rgba(70,150,255,.55);box-shadow:0 0 30px rgba(70,150,255,.14);color:#78b0ff}
.sn-social-icon-card.youtube:hover{border-color:rgba(255,45,45,.55);box-shadow:0 0 30px rgba(255,45,45,.14);color:#ff5252}
.sn-social-icon-card svg{width:28px;height:28px;fill:currentColor}
.sn-social-icon-name{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase}
.sn-social-icon-card:nth-child(1){transition-delay:.05s}
.sn-social-icon-card:nth-child(2){transition-delay:.15s}
.sn-social-icon-card:nth-child(3){transition-delay:.25s}
@media(max-width:768px){
  .sn-social-icons-row{display:flex;flex-wrap:nowrap;justify-content:center;gap:.7rem;max-width:none;padding:0 1rem;margin:0}
  .sn-social-icon-card{flex:1 1 0;min-width:0;max-width:112px;padding:1.1rem .4rem}
  .sn-social-icon-card svg{width:22px;height:22px}
  .sn-social-icon-name{font-size:.52rem;letter-spacing:.1em}
}

/* ===== FOOTER (az index.html-lel azonos) ===== */
.sn-footer{position:relative;width:100%;height:80vh;min-height:520px;max-height:900px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:#000;isolation:isolate;z-index:1}
.sn-footer-video-container{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;overflow:hidden;z-index:0}
.sn-footer-video{position:absolute!important;top:50%!important;left:50%!important;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;max-width:none!important;max-height:none!important;object-fit:cover!important;object-position:center!important;transform:translate(-50%,-50%) scale(1.06)!important;z-index:0}
.sn-footer-video.mobile-video{display:none}
@media(max-width:768px){.sn-footer-video.desktop-video{display:none}.sn-footer-video.mobile-video{display:block}}
.sn-footer-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,rgba(0,0,0,.25) 40%,rgba(0,0,0,.68) 100%);z-index:1}
.sn-footer-bar{position:relative;z-index:3;padding:2rem 3rem 2.5rem;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:2rem}
.sn-footer-links{display:flex;flex-direction:column;gap:.85rem}
.sn-footer-links a{font-family:'Space Mono',monospace;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);text-decoration:none;transition:color .25s ease;line-height:1.4}
.sn-footer-links a:hover{color:rgba(255,255,255,.9)}
.sn-footer-copy{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);text-align:right;line-height:1.4}
@media(max-width:768px){
  .sn-footer{height:82vh;min-height:580px}
  .sn-footer-bar{padding:1.4rem 1.6rem 1.8rem;flex-direction:column;align-items:flex-start;gap:1.6rem}
  .sn-footer-links{position:absolute;top:-415px;left:1.6rem;z-index:4}
  .sn-footer-copy{width:100%;order:2;text-align:left}
  .sn-footer-links a{font-size:.82rem}
}
</style>
</head>

function imgFix(img){
  const list=IMG[img.dataset.b][img.dataset.l],i=(+img.dataset.i||0)+1;
  if(i<list.length){img.dataset.i=i;img.src=list[i]}else img.style.display='none'}

  const T=TXT[lang];ls('senkisem.lang',lang);document.documentElement.lang=lang;

  history.replaceState(null,'','?lang='+lang);
}

function snCloseMobileNav(){$('sn-mobile-nav').classList.remove('open');document.body.style.overflow=''}
(function(){
  var nb=$('sn-navbar'),tk=false;
  addEventListener('scroll',function(){if(!tk){tk=true;requestAnimationFrame(function(){nb.classList.toggle('scrolled',pageYOffset>80);tk=false})}},{passive:true});
  nb.classList.toggle('scrolled',pageYOffset>80);
  $('sn-hamburger-btn').addEventListener('click',function(){var o=$('sn-mobile-nav').classList.toggle('open');document.body.style.overflow=o?'hidden':''});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')snCloseMobileNav()});
})();

/* ---------- SOCIAL reveal ---------- */
(function(){
  var row=$('sn-social-icons-row');if(!row)return;
  new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.querySelectorAll('.sn-social-icon-card').forEach(function(c){c.classList.add('visible')})})},{threshold:.2}).observe(row);
})();

/* ---------- FOOTER videó ---------- */
(function(){
  var d=$('sn-footer-video-desktop'),m=$('sn-footer-video-mobile');if(!d||!m)return;
  function swap(){
    if(innerWidth<=768){d.style.display='none';m.style.display='block';m.play().catch(function(){})}
    else{m.style.display='none';d.style.display='block';d.play().catch(function(){})}
  }
  swap();addEventListener('resize',swap);
})();
