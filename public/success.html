<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <meta name="theme-color" content="#000000">
  <title>Senkisem </title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:1.5rem;background:#000;color:#fff;font-family:system-ui,sans-serif}.card{width:min(32rem,100%);padding:clamp(2rem,7vw,4rem);border:1px solid rgba(255,255,255,.16);background:radial-gradient(ellipse at 50% 0%,rgba(224,33,43,.15),transparent 65%),#080808;text-align:center;animation:arrive .7s cubic-bezier(.16,1,.3,1) both}.mark{margin:0 0 1rem;color:#e0212b;font-size:.75rem;letter-spacing:.35em;text-transform:uppercase}.pulse{width:3.5rem;height:3.5rem;margin:0 auto 1.5rem;border:1px solid rgba(224,33,43,.65);border-radius:50%;display:grid;place-items:center;animation:pulse 2s ease-in-out infinite}.pulse:after{content:'';width:.65rem;height:.65rem;border-radius:50%;background:#e0212b;box-shadow:0 0 1.3rem #e0212b}h1{margin:0;font-family:Georgia,serif;font-size:clamp(2rem,8vw,3rem);font-weight:400}p{color:rgba(255,255,255,.7);line-height:1.7}a{display:inline-block;margin-top:1rem;padding:.8rem 1.2rem;border:1px solid rgba(255,255,255,.35);color:#fff;text-decoration:none}a:hover{background:#fff;color:#000}@keyframes arrive{from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:none}}@keyframes pulse{50%{box-shadow:0 0 1.5rem rgba(224,33,43,.3);transform:scale(1.05)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
  </style>
  <script>
    (function(){
      var source=new URLSearchParams(location.search),target=new URL('/support.html',location.origin);
      var session=source.get('session_id')||source.get('s');
      if(session)target.searchParams.set('s',session);
      else if(source.get('c'))target.searchParams.set('c','1');
      var lang=source.get('lang');if(lang==='hu'||lang==='en')target.searchParams.set('lang',lang);
      location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <main class="card">
    <p class="mark">Senkisem</p><div class="pulse" aria-hidden="true"></div>
    <h1>A fizetés ellenőrzése</h1>
    <p>A támogatási oldalra irányítunk, ahol a szerver ellenőrzi a fizetés állapotát.</p>
    <a href="/support.html">Tovább a támogatási oldalra</a>
  </main>
</body>
</html>
