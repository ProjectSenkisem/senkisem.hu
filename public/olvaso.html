*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Space Mono',monospace;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#stage{position:fixed;left:0;top:0;width:100%;height:100%}
#stage canvas{display:block;touch-action:none;cursor:grab}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ui{position:fixed;z-index:10;font-size:12px;color:rgba(255,255,255,.6)}
#back{top:max(14px,env(safe-area-inset-top));left:16px;text-decoration:none}
#back:hover,#menuBtn:hover{color:#fff}
#menuBtn{top:max(10px,env(safe-area-inset-top));right:12px;font-size:20px;padding:4px 10px}
#menu{top:calc(max(10px,env(safe-area-inset-top)) + 40px);right:12px;background:rgba(10,10,10,.96);border:1px solid rgba(255,255,255,.2);padding:6px;min-width:230px}
#menu[hidden],#hard[hidden],#help[hidden]{display:none}
#menu button,#menu label{display:block;width:100%;text-align:left;padding:10px;font-size:12px}
#menu a{display:block;width:100%;text-align:left;padding:10px;font-size:12px;color:inherit;text-decoration:none}
#menu button:hover,#menu a:hover{background:#fff;color:#000}
#menu [hidden]{display:none}
#langs{top:max(10px,env(safe-area-inset-top));right:58px;display:flex;gap:6px;align-items:center}
.flag{width:34px;height:34px;padding:3px;border-radius:50%;border:2px solid transparent;opacity:.5;transition:opacity .2s}
.flag svg{display:block;width:100%;height:100%;border-radius:50%}
.flag[aria-pressed=true]{opacity:1;border-color:#fff}
.flag:hover{opacity:.9}
.flag:focus-visible,#menuBtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
#menu input{width:70px;background:#000;color:#fff;border:1px solid #555;padding:3px;font:inherit}
#nav{bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;white-space:nowrap}
#nav .a{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);font-size:16px}
#nav .a:disabled{opacity:.2}
#stat{text-align:center;line-height:1.5}
#saved{bottom:max(18px,env(safe-area-inset-bottom));right:14px;font-size:11px;opacity:.5}
#toast{top:60px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 14px;max-width:88vw;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
#load{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#load.off{opacity:0;pointer-events:none}
#done{bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 22px;z-index:30}
body.writing #nav,body.writing #saved{display:none}
#ta{position:fixed;z-index:20;border:0;outline:1px dashed rgba(0,0,0,.3);background:transparent;color:#0c0c28;font-family:Caveat,cursive;line-height:1.25;padding:0;margin:0;resize:none;overflow:auto;caret-color:#0c0c28}
#hard,#help{position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);background:#0a0a0a;border:1px solid rgba(255,255,255,.25);padding:22px;width:min(440px,90vw);font-size:13px;line-height:1.7}
#hard a{color:#fff}
#hard button,#help button{margin-top:14px;border:1px solid #fff;padding:8px 14px}

<style>
/* ======================================================================
   ÚJ: élő jelenlét · mások jegyzetei · támogatás-fiók · hátlap-felirat
   (minden új elem pointer-events:none vagy az olvasó fölött/alatt ül,
   és íráskor eltűnik)
   ====================================================================== */
#menu{max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);overflow-y:auto}
body.writing #live,body.writing #supTab,body.writing #endNudge,body.writing #note{display:none}

/* EKG-jel (a support.html-ből) */
.ecg{width:44px;height:18px;fill:none;stroke:#e0212b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;overflow:visible;filter:drop-shadow(0 0 4px rgba(224,33,43,.8));flex:none}
.ecg .b{opacity:.3}
.ecg .r{stroke-dasharray:24 200;animation:ecgrun 2.2s linear infinite}
@keyframes ecgrun{from{stroke-dashoffset:24}to{stroke-dashoffset:-100}}

/* „jelenleg olvassa” */
#live{top:calc(max(14px,env(safe-area-inset-top)) + 24px);left:16px;font-size:10.5px;letter-spacing:.04em;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:7px;pointer-events:none}
#live i{width:6px;height:6px;border-radius:50%;background:#e0212b;box-shadow:0 0 8px #e0212b;animation:lvp 2.4s ease-in-out infinite}
@keyframes lvp{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

/* a támogatás füle (alul, középen) */
#supTab{left:50%;bottom:0;transform:translateX(-50%);height:17px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;line-height:1;white-space:nowrap;color:rgba(255,255,255,.85);background:rgba(18,4,6,.92);border:1px solid rgba(224,33,43,.6);border-bottom:0;border-radius:9px 9px 0 0;animation:tabGlow 3.2s ease-in-out infinite;transition:background .25s,color .25s}
#supTab:hover{color:#fff;background:rgba(224,33,43,.35)}
#supTab:focus-visible{outline:2px solid #fff;outline-offset:2px}
#supTab .ecg{width:24px;height:10px;stroke-width:2}
#supTab .ar{font-size:7px;opacity:.7}
@keyframes tabGlow{0%,100%{box-shadow:0 -2px 10px rgba(224,33,43,.25)}50%{box-shadow:0 -4px 22px rgba(224,33,43,.7)}}
#supTab.nudge{animation:tabNudge 1.4s ease-in-out 1}
@keyframes tabNudge{0%,100%{transform:translateX(-50%)}30%{transform:translateX(-50%) translateY(-5px)}60%{transform:translateX(-50%)}80%{transform:translateX(-50%) translateY(-2px)}}

/* támogatás-fiók */
#supBack{position:fixed;inset:0;z-index:33;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
#supBack.on{opacity:1;visibility:visible;transition-delay:0s}
#sup{position:fixed;z-index:34;left:50%;bottom:0;width:min(780px,100%);max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;background:#070707;border:1px solid rgba(255,255,255,.16);border-bottom:0;border-radius:16px 16px 0 0;transform:translate(-50%,104%);visibility:hidden;transition:transform .55s cubic-bezier(.16,1,.3,1),visibility 0s .55s}
#sup.on{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
#sup .sx-grab{position:sticky;top:0;z-index:3;display:flex;justify-content:center;align-items:center;padding:10px 0 8px;background:linear-gradient(#070707 65%,transparent);touch-action:none;cursor:grab}
#sup .sx-grab::before{content:'';width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
#supX{position:absolute;right:8px;top:2px;width:38px;height:38px;font-size:15px;color:rgba(255,255,255,.7)}
#supX:hover{color:#fff}
#sup a:focus-visible,#supX:focus-visible{outline:2px solid #fff;outline-offset:2px}
#sup .sx-main{padding:10px 28px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
#sup .sx-h{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(2.4rem,9vw,4.2rem);line-height:.95;letter-spacing:-.03em;color:#fff}
#sup .sx-h i{display:block;font-size:.6em;color:rgba(255,255,255,.78)}
#sup .sx-q{font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:1.25rem;line-height:1.2;color:rgba(255,255,255,.92)}
#sup .sx-p{max-width:46ch;font-size:12.5px;line-height:1.75;color:rgba(255,255,255,.64)}
#sup .sx-go{display:inline-flex;align-items:center;gap:14px;padding:16px 36px 16px 28px;border-radius:999px;background:#fff;color:#000;text-decoration:none;font-family:'DM Serif Display',Georgia,serif;font-size:1.5rem;line-height:1;transition:background .3s,color .3s,transform .3s}
#sup .sx-go:hover{background:#e0212b;color:#fff;transform:scale(1.04)}
#sup .sx-go:hover .ecg{stroke:#fff;filter:none}
#sup .sx-tiny{font-size:11px;color:rgba(255,255,255,.55)}
#sup .sx-soc{padding:26px 20px 28px;border-top:1px solid rgba(255,255,255,.09)}
#sup .sx-lab{text-align:center;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:18px}
#sup .sx-row{display:flex;justify-content:center;gap:12px}
#sup .sx-card{flex:1 1 0;max-width:128px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);border-radius:4px;color:rgba(255,255,255,.6);text-decoration:none;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;transition:border-color .3s,background .3s,color .3s}
#sup .sx-card svg{width:24px;height:24px;fill:currentColor}
#sup .sx-card:hover{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff}
#sup .sx-card.tiktok:hover{border-color:rgba(0,255,200,.4)}
#sup .sx-card.instagram:hover{border-color:rgba(70,150,255,.55);color:#78b0ff}
#sup .sx-card.youtube:hover{border-color:rgba(255,45,45,.55);color:#ff5252}
#sup .sx-foot{position:relative;height:230px;overflow:hidden;background:#000;isolation:isolate;display:flex;align-items:flex-end}
#sup .sx-foot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#sup .sx-foot::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,.7),rgba(0,0,0,.25) 45%,rgba(0,0,0,.72));pointer-events:none}
#sup .sx-bar{position:relative;z-index:2;width:100%;padding:18px 24px calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
#sup .sx-bar a{display:block;margin-top:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.62);text-decoration:none;transition:color .25s}
#sup .sx-bar a:hover{color:#fff}
#sup .sx-copy{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);text-align:right;line-height:1.5}
@media(max-width:520px){#sup .sx-copy{text-align:left}#sup .sx-main{padding:10px 20px 34px}}

/* mások jegyzete: a lap üres mezőjében, ha olvasható; különben alul, kis kártyán */
#note{position:fixed;z-index:11;pointer-events:none;opacity:0;visibility:hidden;color:#1d1530;font-family:Caveat,cursive;line-height:1.2;transition:opacity 1.1s ease,visibility 0s 1.1s}
#note.on{opacity:1;visibility:visible;transition-delay:0s}
#note .nl{display:block;font-family:'Space Mono',monospace;font-size:.62em;letter-spacing:.04em;opacity:.55;margin-bottom:.4em}
#note .nt{display:block}
#note .nn{display:block;margin-top:.3em;font-size:.74em;opacity:.7;text-align:right}
#note.over{padding:.5em .7em;background:rgba(255,239,196,.93);box-shadow:0 2px 10px rgba(0,0,0,.18);transform:rotate(-1.2deg);border-radius:2px}
#note.dock{left:50%;transform:translateX(-50%);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 56px);width:min(330px,86vw);padding:12px 16px;background:rgba(14,14,14,.94);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:17px;border-radius:3px}

/* a hátlapon: halk támogatás-felirat */
#endNudge{left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 58px);transform:translate(-50%,8px);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;width:max-content;max-width:min(360px,92vw);text-align:center;padding:9px 16px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(10,10,10,.85);color:rgba(255,255,255,.62);text-decoration:none;font-size:11px;letter-spacing:.04em;opacity:0;visibility:hidden;transition:opacity 1.4s ease,transform 1.4s ease,border-color .3s,color .3s,visibility 0s 1.4s}
#endNudge.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition-delay:0s,0s,0s,0s,0s}
#endNudge b{font-weight:400;color:#ff4350}
#endNudge:hover{color:#fff;border-color:rgba(224,33,43,.6)}
#endNudge:focus-visible{outline:2px solid #fff;outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  .ecg .r{animation:none;stroke-dasharray:none}.ecg .b{display:none}
  #live i,#supTab,#supTab.nudge{animation:none}
}

/* ---------- Szövegrajzolás a lapra ---------- */
function wrap(x,t,mw){const o=[];for(const para of t.split('\n')){let l='';for(const w of para.split(' ')){const tr=l?l+' '+w:w;if(x.measureText(tr).width>mw&&l){o.push(l);l=w}else l=tr}o.push(l)}return o}
function drawText(x,Wd,Hd,t,n){
  const [zx,zy,zw,zh]=WR[n].zone,bx=zx*Wd,by=zy*Hd,bw=zw*Wd,bh=zh*Hd;let fs=FS*Hd,ls;
  for(;;){x.font=fs+'px Caveat,cursive';ls=wrap(x,t,bw);if(ls.length*fs*1.25<=bh||fs<=Hd*.018)break;fs-=2}
  x.fillStyle='rgba(12,12,40,.92)';x.textBaseline='top';const mx=Math.max(1,Math.floor(bh/(fs*1.25)));
  ls.slice(0,mx).forEach((l,i)=>x.fillText(i===mx-1&&ls.length>mx?l+'…':l,bx,by+i*fs*1.25));
}

/* ---------- Képbetöltés + textúrák ---------- */
const rawImg=n=>new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>{if(BK==='notes'&&LANG==='hu'&&!im.dataset.f){im.dataset.f=1;im.src='assets/book/p'+pad(n)+'.webp'}else r(null)};im.src=IMG+'p'+pad(n)+'.webp'});

  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);
  if(a&&a.t)drawText(x,c.width,c.height,a.t,n);
  else{const [zx,zy,zw,zh]=wr.zone;x.setLineDash([10,10]);x.lineWidth=2;x.strokeStyle='rgba(0,0,0,.2)';x.strokeRect(zx*c.width,zy*c.height,zw*c.width,zh*c.height);

  x.fillStyle='#161616';x.fillRect(0,0,W,H);if(im){const m=W*.022;x.drawImage(im,m,m,W-2*m,H-2*m)}   // sötét "kemény fedél" keret: a fehér borító se olvad bele a fehér lapokba
  x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=Math.max(2,W*.004);x.strokeRect(0,0,W,H);return new THREE.CanvasTexture(c)}
const AO=(()=>{const c=document.createElement('canvas');c.width=256;c.height=2;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,256,0);g.addColorStop(0,'#000');g.addColorStop(.1,'#fff');x.fillStyle=g;x.fillRect(0,0,256,2);return new THREE.CanvasTexture(c)})();
const NOTEX=new THREE.MeshStandardMaterial({color:'#fff'});

/* ---------- Lap + könyv ---------- */
class PageCurve extends M.UserDefined{
  constructor(){super();this.intensity=1;this.renderVector=(v)=>{let r=v.getRatio(M.ModConstant.X);const R=.812,Mid=.325;
    if(r<=R){r/=R;let e;if(r<Mid){r/=Mid;e=Math.sqrt(1-r*r+r*2-1)}else{r=(r-Mid)/(1-Mid);e=(Math.cos(r*Math.PI)+1)/2}
      v.setValue(M.ModConstant.Z,v.getValue(M.ModConstant.Z)+e*.054*this.intensity)}}}}
const flipU=g=>{const a=g.attributes.uv;for(let i=0;i<a.count;i++)a.setXY(i,1-a.getX(i),a.getY(i));return g};
class FlipPage extends THREE.Mesh{
  constructor(sub){super();
    const plane=new THREE.Mesh(mergeGeometries([flipU(new THREE.PlaneGeometry(1,1,sub,sub)),flipU(new THREE.PlaneGeometry(1,1,sub,sub).rotateY(Math.PI))],true),[NOTEX,NOTEX]);
    plane.rotateX(Math.PI/2);plane.position.x=.5;this.scale.z=-1;this.add(plane);this.page=plane;
    this.mods=new M.ModifierStack(plane);this.bend=new M.Bend(0,0,0);this.bend.constraint=M.ModConstant.LEFT;
    this.twist=new M.Twist(0);this.twist.vector=new M.Vector3(2,0,0);this.twist.center=new M.Vector3(-.5,0,0);
    this.curve=new PageCurve();this.mods.addModifier(this.curve);this.mods.addModifier(this.bend);this.mods.addModifier(this.twist);this._p=-1;this._ci=-1}
  flip(p,dir,ci){this.rotation.z=Math.PI*p;this.bend.force=Math.min(-Math.sin(this.rotation.z)/2,-1e-4)*dir;this.twist.angle=Math.sin(this.rotation.z)/10;
    this.curve.intensity=(-1+2*p)*(-Math.sin(this.rotation.z)+1)*ci;this.mods.apply();this._p=p;this._ci=ci}
}
class FlipBook extends THREE.Group{
  constructor(n){super();this.pages=[];this.prog=0;this.goal=0;this.step=0;this.dir=1;
    for(let i=0;i<n;i++){const p=new FlipPage(16);this.add(p);this.pages.push(p)}this.flipPages()}
  get N(){return this.pages.length}
  get moving(){return this.step!==0}
  go(g){g=clamp(g,0,this.N);const d=g-this.prog;this.goal=g;this.step=d?d/.5:0;this.dir=d>0?1:-1}
  set(g){this.prog=this.goal=g;this.step=0;this.flipPages()}
  animate(dt){if(!this.step)return false;this.prog+=this.step*dt;
    if((this.step>0&&this.prog>=this.goal)||(this.step<0&&this.prog<=this.goal)){this.prog=this.goal;this.step=0}this.flipPages();return true}
  flipPage(pg){const i=this.pages.indexOf(pg);this.go(this.goal*2<=i*2?i+1:i)}
  flipPages(){
    const N=this.N,ai=Math.floor(this.prog),ap=this.prog%1;
    const ci=this.prog<1?ap:this.prog>=N?0:this.prog>=N-1?1-ap:1;
    this.pages.forEach((pg,i)=>{
      const p=ai<i?0:ai>i?1:ap;
      if(p!==pg._p||Math.abs(pg._ci-ci)>.005)pg.flip(p,this.dir,ci);   // MINDEN lapnak azonos görbületet kell kapnia, különben átlyukadnak egymáson
      const yp=p<.5?0:(p-.5)/.5,L=-.001*(N-i),R=-.001*i;pg.position.y=R+yp*(L-R)});
    this.position.x=ai===0?-.5+.5*ap:ai===N-1?.5*ap:ai===N?.5:0;
  }
}

/* ---------- Jelenet ---------- */
const stage=$('stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0);
const dl_=new THREE.DirectionalLight(0xffffff,1);dl_.position.set(.2,1,0);scene.add(dl_,new THREE.AmbientLight(0xffffff,2));
const camera=new THREE.PerspectiveCamera(30,1,.1,100);

const view={x:0,z:0,zoom:1,tilt:.25,ry:0},tgt={...view};let D_=3.2,dirty=true,portrait=false,writing=null,savedTgt=null;
const invalidate=()=>{dirty=true};
function applyView(){root.position.set(view.x,0,view.z);root.rotation.y=view.ry;camera.zoom=view.zoom;camera.position.set(0,D_,D_*view.tilt);camera.up.set(0,0,-1);camera.lookAt(0,0,0);camera.updateProjectionMatrix();camera.updateMatrixWorld()}

  const vv=window.visualViewport,w=innerWidth,h=vv?vv.height:innerHeight;
  stage.style.height=h+'px';stage.style.top=(vv?vv.offsetTop:0)+'px';
  const a=w/h;portrait=a<.9;camera.aspect=a;renderer.setSize(w,h);
  D_=(portrait?Math.max(1.25/a,1.55):Math.max(2.4/a,1.7))/(2*Math.tan(THREE.MathUtils.degToRad(15)));

}

/* ---------- Ablak (lusta textúrák) ---------- */
const sideOf=e=>e%2===0?1:0;
async function fill(pg,e,withAns=true){
  const it=ITEMS[e],side=sideOf(e);let tex=null;
  if(it==='end')tex=frameTex(null);else if(COVERS.has(it))tex=frameTex(await loadImg(it));else if(it!=='blank')tex=makeTex(await loadImg(it),it,withAns);
  if(!pg._want){if(tex)tex.dispose();return}
  const old=pg.page.material[side];pg.page.material[side]=tex||new THREE.MeshStandardMaterial({color:'#fff'});
  if(tex)pg.page.material[side]=mkMat(tex,side);disposeMat(old);invalidate();
}
function drop(pg,i){pg._want=false;for(const s of[0,1]){disposeMat(pg.page.material[s]);pg.page.material[s]=NOTEX}ITEMS.slice(i*2,i*2+2).forEach(n=>imgs.delete(n))}
function syncWindow(force){
  const c=Math.floor(book.prog),ps=[];
  book.pages.forEach((pg,i)=>{
    const need=Math.abs(i-c)<=3;
    if(force&&pg._want){drop(pg,i)}
    if(need&&!pg._want){pg._want=true;ps.push(fill(pg,i*2),fill(pg,i*2+1))}
    else if(!need&&pg._want)drop(pg,i);
  });return Promise.all(ps);
}
function reloadAll(){syncWindow(true)}
function refreshItem(e,withAns){const pg=book.pages[e>>1];if(pg._want)fill(pg,e,withAns)}

/* ---------- Pozíció a lapon ---------- */
function wp(pg,side,rx,ry){const u=rx,v=1-ry;pg.updateWorldMatrix(true,true);return pg.page.localToWorld(new THREE.Vector3(side===0?.5-u:u-.5,v-.5,0))}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();

  const r=cv.getBoundingClientRect();ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const h=ray.intersectObject(book,true)[0];if(!h||!h.face)return null;let o=h.object;while(o&&!(o instanceof FlipPage))o=o.parent;if(!o)return null;
  const i=book.pages.indexOf(o),e=i*2+(h.face.materialIndex===1?0:1);return{pg:o,e,uv:h.uv,item:ITEMS[e]};
}

/* ---------- Írás ---------- */
const ta=$('ta');

  view.ry=0;applyView();root.updateMatrixWorld(true);
  const c=wp(writing.pg,writing.side,.5,.5),vh=visH0();
  tgt.ry=0;tgt.tilt=0;tgt.x=view.x-c.x;tgt.z=view.z-c.z;tgt.zoom=Math.min(vh/(1/ASPECT*1.12),vh*camera.aspect/1.12);
  if(REDUCE)Object.assign(view,tgt);
}

  const s=(rx,ry)=>{const v=wp(pg,side,rx,ry).project(camera);return{x:(v.x+1)/2*r.width+r.left,y:(1-v.y)/2*r.height+r.top}};
  const[zx,zy,zw,zh]=w.zone,a=s(zx,zy),b=s(zx+zw,zy+zh),t=s(.5,0),u=s(.5,1);
  Object.assign(ta.style,{left:a.x+'px',top:a.y+'px',width:(b.x-a.x)+'px',height:(b.y-a.y)+'px',fontSize:Math.abs(u.y-t.y)*FS+'px'});
}
async function startWrite(h){
  await document.fonts.load('40px Caveat','őűŐŰáé');
  writing={n:h.item,e:h.e,pg:h.pg,side:sideOf(h.e),w:WR[h.item],shown:false};savedTgt={...tgt};
  document.body.classList.add('writing');$('menu').hidden=true;refreshItem(h.e,false);
  ta.value=(D.answers[h.item]&&D.answers[h.item].t)||'';ta.maxLength=writing.w.max;focusView();
}
function showTA(){ta.hidden=false;$('done').hidden=false;layoutTA();ta.focus({preventScroll:true})}
function endWrite(){
  if(!writing)return;const w=writing;writing=null;ta.hidden=true;$('done').hidden=true;ta.blur();document.body.classList.remove('writing');

}

  if(!writing)return;let v=ta.value;if(writing.w.one)v=v.replace(/\n/g,' ');
  if(v.length>writing.w.max){v=v.slice(0,writing.w.max);toast(T.full)}ta.value=v;
  if(v.trim())D.answers[writing.n]={t:v,u:iso()};else delete D.answers[writing.n];sched();updateUI();

const ptrs=new Map();let g=null,pinch=null;

  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)g={x:e.clientX,y:e.clientY,t:performance.now(),moved:false,rot:e.button===2||e.shiftKey,touch:e.pointerType!=='mouse'};
  else if(ptrs.size===2&&!writing){g=null;pinch={d:pdist(),z:view.zoom}}

  const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(writing)return;

  if(!g)return;

  if(!g.moved)return;

  else{const wpp=visH0()/view.zoom/cv.clientHeight;view.x+=dx*wpp;view.z+=dy*wpp;clampView(view)}
  sync();invalidate();
});

  if(g&&!g.moved&&ptrs.size===0&&e.type==='pointerup'&&performance.now()-g.t<350)onTap(e.clientX,e.clientY);

  const v=document.createElement('video');v.muted=true;v.setAttribute('muted','');v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';

  gr.addEventListener('pointerdown',e=>{if(e.target.closest('#supX'))return;sy=e.clientY;gr.setPointerCapture(e.pointerId)});
  gr.addEventListener('pointermove',e=>{if(sy!==null&&e.clientY-sy>50){sy=null;closeSup()}});
  gr.addEventListener('pointerup',()=>{sy=null});gr.addEventListener('pointercancel',()=>{sy=null});

function openSup(){
  if(supOpen||writing)return;buildSup();hideNote();menu.hidden=true;$('menuBtn').setAttribute('aria-expanded','false');
  supOpen=true;supBack.classList.add('on');supEl.classList.add('on');supEl.setAttribute('aria-hidden','false');supTab.setAttribute('aria-expanded','true');
  if(supVid&&!REDUCE)supVid.play().catch(()=>{});
  setTimeout(()=>{const x=$('supX');x&&x.focus({preventScroll:true})},60);
}
function closeSup(){
  if(!supOpen)return;supOpen=false;supBack.classList.remove('on');supEl.classList.remove('on');supEl.setAttribute('aria-hidden','true');supTab.setAttribute('aria-expanded','false');
  if(supVid)supVid.pause();supTab.focus({preventScroll:true});
}
supTab.onclick=openSup;supBack.onclick=closeSup;$('mSup').onclick=()=>{menu.hidden=true;openSup()};
// amíg a fiók nyitva van, a könyv nem lapozódik a háttérben
document.addEventListener('keydown',e=>{
  if(!supOpen)return;
  if(e.key==='Escape'){e.stopImmediatePropagation();closeSup();return}
  if(['ArrowLeft','ArrowRight','Home','End',' ','+','=','-','0'].includes(e.key))e.stopImmediatePropagation();
},true);
// a fül időnként finoman „felkínálja magát” (csak ha épp nem olvas/ír intenzíven)
(function nudge(){setTimeout(()=>{if(!REDUCE&&!supOpen&&!writing&&!document.hidden){supTab.classList.add('nudge');setTimeout(()=>supTab.classList.remove('nudge'),1500)}nudge()},ri(40000,75000))})();

/* ---------- Hátlap: halk támogatás-felirat + a jegyzetek időzítője ---------- */
const endEl=$('endNudge');endEl.href=SUPURL;
let spreadKey=-1,spreadSince=NOW(),snap='';
setInterval(()=>{
  const t=NOW(),goal=book.goal;
  if(goal!==spreadKey){spreadKey=goal;spreadSince=t;lastAct=t;hideNote()}
  const sn=[view.x,view.z,view.zoom,view.tilt,view.ry].map(v=>v.toFixed(3)).join();
  if(sn!==snap){snap=sn;lastAct=t;hideNote()}                                   // mozog a nézet: ne zavarjunk
  endEl.classList.toggle('on',goal===book.N&&!book.moving&&!writing&&!supOpen&&t-spreadSince>1800);
  if(!ambOn||!B.diary||noteOn||writing||supOpen||!menu.hidden||document.hidden||book.moving||ptrs.size)return;
  if(t<nextNoteAt||t-lastAct<6000||t-spreadSince<8000)return;                   // legalább 6 mp nyugalom, 8 mp ugyanazon a lapon
  const c=emptyPages();if(!c.length||Math.random()>.35)return;
  showNote(c[ri(0,c.length-1)]);
},800);
</script>
